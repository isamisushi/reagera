<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reagera checkout</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f3f4f6; color: #111827; }
  .app { max-width: 480px; margin: 40px auto; background: #fff; padding: 16px 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h1, h2 { margin: 0 0 12px; font-weight: 600; }
  h2 { font-size: 16px; margin-top: 16px; }
  .shelf { display: flex; gap: 8px; flex-wrap: wrap; }
  .shelf button, .pay button, .declined button { font: inherit; padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; }
  .cart { list-style: none; padding: 0; margin: 12px 0; }
  .cart li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
  .cart li span:first-child { flex: 1; }
  .price { color: #6b7280; }
  .x { border: 0; background: none; color: #9ca3af; cursor: pointer; font-size: 18px; }
  .pay { display: flex; justify-content: space-between; align-items: center; }
  .pay .primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .pay button[disabled] { opacity: .6; cursor: wait; }
  .declined { margin-top: 12px; padding: 8px 12px; background: #fee2e2; color: #991b1b; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
  .receipts p { margin: 4px 0; font: 14px ui-monospace, Menlo, monospace; color: #065f46; }
  .past { display: block; margin-top: 12px; color: #92400e; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import init from "/pkg/checkout/reagera_example_checkout.js";
  init();
</script>
</body>
</html>
