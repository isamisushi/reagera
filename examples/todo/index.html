<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reagera todo</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f3f4f6; color: #111827; }
  .app { max-width: 480px; margin: 40px auto; background: #fff; padding: 16px 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h1 { margin: 0 0 12px; font-weight: 600; }
  form input { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
  .list { list-style: none; padding: 0; margin: 12px 0; }
  .list li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
  .list li span { flex: 1; }
  .list li.done span { text-decoration: line-through; color: #9ca3af; }
  .x { border: 0; background: none; color: #9ca3af; cursor: pointer; font-size: 18px; }
  footer { display: flex; gap: 6px; align-items: center; font-size: 14px; color: #6b7280; }
  footer span { margin-right: auto; }
  footer button { font: inherit; border: 1px solid transparent; background: none; cursor: pointer; border-radius: 4px; padding: 2px 6px; }
  footer button.on { border-color: #d1d5db; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/dist/examples/todo/app.js"></script>
</body>
</html>
