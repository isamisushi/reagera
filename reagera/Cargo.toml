[package]
name = "reagera"
version = "0.2.0"
description = "A front-end framework where the event log is the state. ConTime histories, minbin bytes, WebAssembly views."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
contime.workspace = true
minbin.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
getrandom.workspace = true
web-sys = { workspace = true, features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement",
  "HtmlSelectElement", "Node", "NodeList", "Text", "Event", "EventTarget", "MouseEvent",
  "KeyboardEvent", "CssStyleDeclaration", "Location", "History", "DomRect", "console",
] }
